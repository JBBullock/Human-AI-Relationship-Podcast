<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Young and Hungry Podcast</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal: #86c5d1;
            --dark-blue: #2c3e50;
            --light-bg: #dbe8ea;
            --white: #ffffff;
            --yellow-popup: #fdf2a7; /* Matched from popup wireframe */
            --heading-font: 'Montserrat', sans-serif;
            --body-font: 'Source Sans Pro', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--body-font); background-color: var(--light-bg); color: var(--dark-blue); }
        h1, h2, h3 { font-family: var(--heading-font); }
        a { text-decoration: none; color: inherit; cursor: pointer; }

        /* Navigation */
        nav {
            background-color: var(--teal);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo { font-size: 1.5rem; font-weight: 800; }
        .nav-links { list-style: none; display: flex; gap: 20px; font-weight: 600; }
        .nav-links li { border-right: 1px solid var(--dark-blue); padding-right: 20px; }
        .nav-links li:last-child { border-right: none; }

        /* Hero Section */
        .hero {
            background-color: #0d82b0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 40px 5%;
            align-items: center;
            color: white;
        }
        .hero-content { text-align: right; }
        .hero-content h1 { font-size: 3rem; margin-bottom: 20px; }
        .btn { 
            display: inline-block; padding: 10px 30px; border-radius: 20px; 
            margin: 5px; font-weight: 700; font-size: 0.9rem; border: none; cursor: pointer;
        }
        .btn-light { background-color: #add8e6; color: var(--dark-blue); }

        /* MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--yellow-popup);
            width: 90%;
            max-width: 500px;
            padding: 40px;
            border-radius: 20px;
            position: relative;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid var(--dark-blue);
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: var(--dark-blue);
        }

        .modal-content h2 { margin-bottom: 20px; font-size: 2rem; color: var(--dark-blue); }
        .modal-content p { font-style: italic; margin-bottom: 30px; font-size: 1.2rem; }

        .input-group {
            display: flex;
            border: 1px solid var(--dark-blue);
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }

        .input-group input {
            flex: 1;
            padding: 15px;
            border: none;
            outline: none;
            font-family: var(--body-font);
            font-style: italic;
        }

        .subscribe-btn {
            background-color: var(--teal);
            border: none;
            padding: 0 25px;
            font-weight: 700;
            color: var(--dark-blue);
            cursor: pointer;
            border-left: 1px solid var(--dark-blue);
        }

        /* Helper class to show modal */
        .show-modal { display: flex; }

        /* Rest of the styles (Episodes, Bio, etc) remain as before... */
        .img-placeholder { background-color: #bcd1d4; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,0.1); color: rgba(0,0,0,0.3); }
        .hero-img { height: 350px; width: 90%; border-radius: 10px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">The Young and Hungry Podcast</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Episodes</a></li>
            <li><a id="navSubscribe" href="javascript:void(0)">Subscribe</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="img-placeholder hero-img">Hero Illustration Placeholder</div>
        <div class="hero-content">
            <h1>Preparing Kids for the AI Future</h1>
            <button class="btn btn-light trigger-waitlist">Join the Waitlist</button><br>
            <a href="#" class="btn btn-light">Listen Now</a>
        </div>
    </section>

    <div class="modal-overlay" id="waitlistModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2>Join the Waitlist</h2>
            <p>Don't miss the first episode! Join the waitlist and listen first.</p>
            <div class="input-group">
                <input type="email" placeholder="Email">
                <button class="subscribe-btn">Subscribe</button>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('waitlistModal');
        const closeBtn = document.getElementById('closeModal');
        const triggers = document.querySelectorAll('.trigger-waitlist, #navSubscribe');

        // Open Modal
        triggers.forEach(trigger => {
            trigger.addEventListener('click', () => {
                modal.classList.add('show-modal');
            });
        });

        // Close Modal via 'X'
        closeBtn.addEventListener('click', () => {
            modal.classList.remove('show-modal');
        });

        // Close Modal via clicking background
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('show-modal');
            }
        });
    </script>

</body>
</html>
